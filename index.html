<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/agenda/">

  <!--
    Restaura a rota pedida diretamente (ex.: /agenda/teatro). O GitHub Pages responde 404
    a essas URLs; o 404.html redireciona para cá com "?p=/teatro" e aqui a URL volta ao
    normal antes de o app iniciar. Só aceita caminhos internos (começando com uma única "/").
  -->
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search).get('p');
      if (p && /^\/(?!\/)/.test(p) && p.indexOf('\\') === -1) {
        window.history.replaceState(null, '', '/agenda' + p);
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="agendacst">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>agendacst</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Teclado no celular. O Flutter cria o próprio <meta name="viewport"> ao iniciar
    (com flt-viewport). Sem "interactive-widget=resizes-content", o Chrome do Android
    só encolhe a área visível e desloca a página inteira para cima ao abrir o teclado,
    somando-se ao ajuste que o Flutter já faz, e a tela "foge". Com resizes-content,
    a página é redimensionada e o Flutter reorganiza o layout acima do teclado.
    "maximum-scale=1.0" evita o zoom automático do iPhone ao tocar em um campo.
  -->
  <script>
    (function () {
      var CONTENT = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content';
      function fix() {
        var metas = document.head.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          if (metas[i].getAttribute('content') !== CONTENT) metas[i].setAttribute('content', CONTENT);
        }
      }
      new MutationObserver(fix).observe(document.head, {
        childList: true, subtree: true, attributes: true, attributeFilter: ['content'],
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.

  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
